<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>GodoStudio — Sites e sistemas para comércios e empresas</title>
    <meta name="description" content="Sites, e-commerces e sistemas para comércios e empresas. Checkout, Stripe, e-mail e assistentes de IA integrados, tudo no ar sem dor de cabeça." />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GodoStudio — Sites e sistemas para comércios e empresas" />
    <meta property="og:description" content="Sites, e-commerces e sistemas para comércios e empresas. Checkout, Stripe, e-mail e assistentes de IA integrados, tudo no ar sem dor de cabeça." />
    <meta property="og:image" content="https://godostudio.vercel.app/og.png" />
    <meta property="og:image:secure_url" content="https://godostudio.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GodoStudio — Sites e sistemas para comércios e empresas, com celular mostrando trabalhos recentes" />
    <meta property="og:site_name" content="GodoStudio" />
    <meta property="og:url" content="https://godostudio.vercel.app/" />
    <meta property="og:locale" content="pt_BR" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GodoStudio — Sites e sistemas para comércios e empresas" />
    <meta name="twitter:description" content="Sites, e-commerces e sistemas para comércios e empresas. Checkout, Stripe, e-mail e assistentes de IA integrados, tudo no ar sem dor de cabeça." />
    <meta name="twitter:image" content="https://godostudio.vercel.app/og.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Theme color -->
    <meta name="theme-color" content="#f8f9fa" />
    <!-- Saved theme (light by default) applied before first paint -->
    <script>
      try {
        if (localStorage.getItem('godostudio-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1f2226');
        }
      } catch (e) {}
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
